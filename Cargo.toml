[package]
name = "poemercpricer"
version = "0.2.0"
edition = "2021"
description = "In-game Path of Exile 3.29 Mercenary Warrant screener — overlay, hotkey, clipboard, OCR"
license = "MIT"
repository = "https://github.com/Lisood/PoEMercPricer"
readme = "README.md"
authors = ["PoEMercPricer contributors"]
keywords = ["path-of-exile", "poe", "overlay", "mercenary"]
categories = ["games"]
rust-version = "1.80"

[dependencies]
anyhow = "1"
arboard = "3"
directories = "6"
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
raw-window-handle = "0.6"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
xcap = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.60", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
